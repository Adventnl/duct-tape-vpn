[workspace]
members = ["crates/duct-core", "crates/duct-server", "crates/duct-bridge"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }

[profile.release]
lto = "thin"
strip = true
