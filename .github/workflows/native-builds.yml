# Manual build probes. Successful compilation never certifies VPN entitlements or routing.
name: native build probes
on: workflow_dispatch
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - shell: bash
        run: |
          cargo build -p duct-bridge --release --locked
          mkdir -p clients/native/windows/bin
          cp target/release/duct_bridge.dll clients/native/windows/bin/
          scripts/prepare-clients.sh
          cd clients/app
          flutter analyze
          flutter test
          flutter build windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned-build-probe
          path: clients/app/build/windows/x64/runner/Release/
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - run: cargo install cargo-ndk --locked
      - run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          scripts/build-native.sh android
          scripts/prepare-clients.sh
          cd clients/app
          flutter analyze
          flutter test
          flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-build-probe
          path: clients/app/build/app/outputs/flutter-apk/app-debug.apk
  apple:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, ios]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
      - uses: actions/setup-go@v5
        with:
          # The pinned WireGuardKitGo source patches this Go runtime.
          go-version: '1.20.14'
      - run: gem install xcodeproj --no-document
      - run: ruby scripts/apple/test-embedding.rb
      - run: |
          scripts/prepare-clients.sh
          scripts/build-native.sh apple
          scripts/apple/fetch-wireguard.sh
          ruby scripts/apple/embed-extension.rb ${{ matrix.platform }} dev.ducttape.ductTapeVpn
          cd clients/app
          flutter analyze
          flutter test
      - run: sh scripts/apple/build-client.sh ${{ matrix.platform }} --unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-unsigned-build-probe
          path: |
            clients/app/build/macos/Build/Products/Debug/*.app
            clients/app/build/ios/iphoneos/*.app
          if-no-files-found: error
